services:
  # ========================================================
  # 1. DATABASE: MySQL 8.0
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: bookingsalon_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Bach@vt05}
      MYSQL_DATABASE: ${DB_NAME:-bookingsalon_app}
      MYSQL_USER: ${DB_USERNAME:-bookingsalon_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Bach@vt05}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initData.sql:/docker-entrypoint-initdb.d/initData.sql:ro
    networks:
      - bookingsalon_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Bach@vt05}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================================================
  # 2. CACHE & LOCK: Redis 7
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: bookingsalon_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookingsalon_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" ping | grep -q PONG || redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================================
  # 3. IAM AUTHENTICATION: Keycloak 26
  # ========================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bookingsalon_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin@123}
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: ${DB_NAME:-bookingsalon_app}
      KC_DB_USERNAME: ${DB_USERNAME:-bookingsalon_user}
      KC_DB_PASSWORD: ${DB_PASSWORD:-Bach@vt05}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bookingsalon_net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ========================================================
  # 4. BACKEND: Spring Boot (Image kéo từ Docker Hub)
  # ========================================================
  backend:
    image: ${DOCKERHUB_USERNAME:-nguyenbach}/bookingsalon-backend:${IMAGE_TAG:-latest}
    container_name: bookingsalon_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bookingsalon_app}
      DB_USERNAME: ${DB_USERNAME:-bookingsalon_user}
      DB_PASSWORD: ${DB_PASSWORD:-Bach@vt05}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}

      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/test-data
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:*"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KEYCLOAK_REALM: booking-salon-realm
      KEYCLOAK_CLIENT_ID: booking-salon-admin
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_FRONTEND_CLIENT_ID: booking-salon-client
      KEYCLOAK_IDP_GOOGLE_ENABLED: "true"
      KEYCLOAK_IDP_GOOGLE_CLIENT_ID: ${KEYCLOAK_IDP_GOOGLE_CLIENT_ID}
      KEYCLOAK_IDP_GOOGLE_CLIENT_SECRET: ${KEYCLOAK_IDP_GOOGLE_CLIENT_SECRET}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

      VNPAY_SIMULATOR_MODE: ${VNPAY_SIMULATOR_MODE:-true}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_NOTIFY_URL: ${VNPAY_NOTIFY_URL}

      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY}
      SEPAY_API_BASE_URL: ${SEPAY_API_BASE_URL}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY}
      SEPAY_ENV: ${SEPAY_ENV:-sandbox}

      PAYMENT_BANK_BIN: ${PAYMENT_BANK_BIN:-970422}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-0866429205}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PAYMENT_EXPIRE_MINUTES: 15
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "8080:8080"
    networks:
      - bookingsalon_net

  # ========================================================
  # 5. FRONTEND: React 19 SPA + Nginx (Image kéo từ Docker Hub)
  # ========================================================
  frontend:
    image: ${DOCKERHUB_USERNAME:-nguyenbach}/bookingsalon-frontend:${IMAGE_TAG:-latest}
    container_name: bookingsalon_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - bookingsalon_net

volumes:
  mysql_data:
    name: bookingsalon_mysql_data
  redis_data:
    name: bookingsalon_redis_data
  keycloak_data:
    name: bookingsalon_keycloak_data

networks:
  bookingsalon_net:
    name: bookingsalon_network
    driver: bridge

