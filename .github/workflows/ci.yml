name: BookingSalon CI/CD Pipeline

on:
  push:
    branches:
      - master
      - demo-app
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - demo-app
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. BACKEND CI: Run Unit & Integration Tests + Package Check
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: BookingSalon Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests & Verify
        working-directory: backend
        run: ./mvnw clean verify -B

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 2. FRONTEND CI: Lint & Production Build Check
  # ─────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend SPA
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 3. DOCKER BUILD & PUSH: Đóng gói & Đẩy Image lên Docker Hub
  # Chỉ thực hiện khi push vào nhánh chính hoặc tạo tag release
  # ─────────────────────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Images
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build & Push Backend ────────────────────────────────
      - name: Extract Metadata for Backend Image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/bookingsalon-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/demo-app' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Frontend ───────────────────────────────
      - name: Extract Metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/bookingsalon-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/demo-app' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8080' }}
            VITE_WS_URL=${{ vars.VITE_WS_URL || 'ws://localhost:8080' }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL || 'http://localhost:8081' }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM || 'booking-salon-realm' }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'booking-salon-client' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 4. CD DEPLOYMENT: Tự động deploy lên VPS Azure qua SSH
  # Chỉ thực hiện khi merge vào master hoặc demo-app
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production VPS
    needs: [docker-build-push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/demo-app')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SSH Credentials
        run: |
          SSH_KEY="${{ secrets.PROD_SSH_KEY || secrets.PROD_SSH_KEY }}"
          if [ -z "$SSH_KEY" ]; then
            echo "❌ LỖI: Secret SSH Key đang bị RỖNG!"
            echo "Hãy kiểm tra trong Repository secrets: bạn cần có secret tên là PROD_SSH_KEY hoặc PRO_SSH_KEY."
            exit 1
          fi
          if [ -z "${{ secrets.PROD_HOST }}" ]; then
            echo "❌ LỖI: Secret PROD_HOST đang bị RỖNG!"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_USER }}" ]; then
            echo "❌ LỖI: Secret PROD_USER đang bị RỖNG!"
            exit 1
          fi
          echo "✅ Đã nạp thành công thông tin SSH (PROD_HOST, PROD_USER, SSH Key)."

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY || secrets.PROD_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "apps/bookingsalon"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY || secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/apps/bookingsalon

            echo "📥 Kéo các Docker image mới nhất từ Docker Hub..."
            docker compose -f docker-compose.prod.yml pull backend-1 backend-2 backend-3 frontend

            echo "🚀 Khởi động và áp dụng cấu hình container mới..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Dọn dẹp image cũ không dùng..."
            docker image prune -f

            echo "🔍 Kiểm tra trạng thái các container sau deploy:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ Tự động triển khai Production hoàn tất!"

      - name: Verify Production Health
        run: |
          echo "⏳ Chờ 15s để các service ổn định..."
          sleep 15
          echo "Kiểm tra Frontend..."
          curl -f -k -s -I https://bookingsalon.nguyenbach.click/ || exit 1
          echo "Kiểm tra Backend API..."
          curl -f -k -s -I https://api-bookingsalon.nguyenbach.click/api/salons || exit 1
          echo "🎉 Toàn bộ hệ thống production đã cập nhật và phản hồi 200 OK!"



