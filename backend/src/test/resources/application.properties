spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Payment / Bank / VNPay (required by @SpringBootTest full context)
bank.merchant-id=TEST_MERCHANT_ID
bank.account-no=TEST_ACCOUNT_NO
bank.bank-code=VIB
bank.api-base-url=https://sandbox-bank-api.example.com
bank.api-key=TEST_API_KEY

vnpay.tmn-code=TEST_TMN_CODE
vnpay.hash-secret=TEST_SECRET_KEY
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=https://your-domain.com/webhooks/vnpay/callback

payment.expire-minutes=15

# Keycloak Admin Client
keycloak.server-url=http://localhost:8081
keycloak.realm=booking-salon-realm
keycloak.client-id=booking-salon-admin
keycloak.client-secret=test-client-secret

# Override main issuer-uri so tests don't call real Keycloak (JwtDecoder is mocked in tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/booking-salon-realm

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

# Logging
logging.level.root=WARN
logging.level.demo.bookingsalon=INFO
logging.level.org.springframework.boot.test=WARN

