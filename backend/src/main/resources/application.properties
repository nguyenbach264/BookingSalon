spring.application.name=BookingSalon

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date/Time Configuration
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:*

# Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_PUBLIC_URL:${KEYCLOAK_SERVER_URL}}/realms/${KEYCLOAK_REALM}

# Keycloak Admin Client
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:${KEYCLOAK_SERVER_URL}}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:booking-salon-client}

# Google Identity Provider for Keycloak
keycloak.idp.google.enabled=${KEYCLOAK_IDP_GOOGLE_ENABLED:true}
keycloak.idp.google.client-id=${KEYCLOAK_IDP_GOOGLE_CLIENT_ID}
keycloak.idp.google.client-secret=${KEYCLOAK_IDP_GOOGLE_CLIENT_SECRET}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# Lettuce connection pool & graceful shutdown
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=2s
spring.data.redis.lettuce.pool.time-between-eviction-runs=30s

# Enable Redis
app.redis.enabled=true

# VNPay Payment Gateway (Sandbox Mock Simulator Mode)
vnpay.simulator-mode=${VNPAY_SIMULATOR_MODE:true}
vnpay.tmn-code=${VNPAY_TMN_CODE:DEMOVNPAY}
vnpay.hash-secret=${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY2026}
vnpay.pay-url=${VNPAY_PAY_URL:http://localhost:5173/payment/vnpay-sandbox-simulator}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/webhook/vnpay/return}
vnpay.notify-url=${VNPAY_NOTIFY_URL:http://localhost:8080/api/v1/payments/webhook/vnpay}

# Sepay Gateway
sepay.merchant-id=${SEPAY_MERCHANT_ID}
sepay.secret-key=${SEPAY_SECRET_KEY}
sepay.api-base-url=${SEPAY_API_BASE_URL}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY}
sepay.env=${SEPAY_ENV:sandbox}

# Bank Transfer
payment.bank.bin=${PAYMENT_BANK_BIN}
payment.bank.account=${PAYMENT_BANK_ACCOUNT}
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}
payment.expire-minutes=${PAYMENT_EXPIRE_MINUTES:15}

logging.level.demo.bookingsalon.payment=DEBUG
logging.level.org.springframework.web=INFO

# SMTP Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart file (Giới hạn 10MB để chống DoS)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cookie Security
app.cookie.secure=${COOKIE_SECURE:false}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# BFF Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=30d
server.servlet.session.timeout=30d

# Rate Limiting Configuration (Distributed via Redis)
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.ratelimit.otp.limit=${RATE_LIMIT_OTP_LIMIT:10}
app.ratelimit.otp.duration=${RATE_LIMIT_OTP_DURATION:60}
app.ratelimit.login.limit=${RATE_LIMIT_LOGIN_LIMIT:20}
app.ratelimit.login.duration=${RATE_LIMIT_LOGIN_DURATION:60}
app.ratelimit.global-ip.limit=${RATE_LIMIT_GLOBAL_IP_LIMIT:200}
app.ratelimit.global-ip.duration=${RATE_LIMIT_GLOBAL_IP_DURATION:60}