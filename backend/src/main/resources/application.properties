spring.application.name=BookingSalon

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_PUBLIC_URL:${KEYCLOAK_SERVER_URL}}/realms/${KEYCLOAK_REALM}

# Keycloak Admin Client
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:${KEYCLOAK_SERVER_URL}}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:booking-salon-client}

# Google Identity Provider for Keycloak
keycloak.idp.google.enabled=${KEYCLOAK_IDP_GOOGLE_ENABLED:true}
keycloak.idp.google.client-id=${KEYCLOAK_IDP_GOOGLE_CLIENT_ID}
keycloak.idp.google.client-secret=${KEYCLOAK_IDP_GOOGLE_CLIENT_SECRET}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=0
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# Lettuce connection pool
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=2s

# Enable Redis
app.redis.enabled=true

# VNPay Payment Gateway
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.notify-url=${VNPAY_NOTIFY_URL}

# Sepay Gateway
sepay.merchant-id=${SEPAY_MERCHANT_ID}
sepay.secret-key=${SEPAY_SECRET_KEY}
sepay.api-base-url=${SEPAY_API_BASE_URL}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY}
sepay.env=${SEPAY_ENV:sandbox}

# Bank Transfer
payment.bank.bin=${PAYMENT_BANK_BIN}
payment.bank.account=${PAYMENT_BANK_ACCOUNT}
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}
payment.expire-minutes=${PAYMENT_EXPIRE_MINUTES:15}

logging.level.demo.bookingsalon.payment=DEBUG
logging.org.springframework.web=INFO

# SMTP Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart file
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# BFF Session Configuration
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=30d
server.servlet.session.timeout=30d