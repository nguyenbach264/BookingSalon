<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="barber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barber-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="pole-clip">
      <rect x="23" y="14" width="18" height="36" rx="9"/>
    </clipPath>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#barber-bg)"/>
  
  <!-- Barber Pole Top Cap -->
  <path d="M20 14h24a2 2 0 0 1 2 2v2H18v-2a2 2 0 0 1 2-2z" fill="url(#barber-gold)"/>
  <circle cx="32" cy="11" r="3" fill="url(#barber-gold)"/>

  <!-- Barber Pole Body Cylinder with stripes -->
  <g clip-path="url(#pole-clip)">
    <!-- White background base -->
    <rect x="23" y="14" width="18" height="36" fill="#f8fafc"/>
    <!-- Red stripes -->
    <path d="M15 16 L45 -4 L45 4 L15 24 Z" fill="#ef4444"/>
    <path d="M15 32 L45 12 L45 20 L15 40 Z" fill="#ef4444"/>
    <path d="M15 48 L45 28 L45 36 L15 56 Z" fill="#ef4444"/>
    <!-- Blue stripes -->
    <path d="M15 24 L45 4 L45 12 L15 32 Z" fill="#3b82f6"/>
    <path d="M15 40 L45 20 L45 28 L15 48 Z" fill="#3b82f6"/>
    <path d="M15 56 L45 36 L45 44 L15 64 Z" fill="#3b82f6"/>
    <!-- Subtle 3D Cylinder shadow overlay -->
    <rect x="23" y="14" width="4" height="36" fill="#000" opacity="0.15"/>
    <rect x="37" y="14" width="4" height="36" fill="#000" opacity="0.15"/>
  </g>

  <!-- Barber Pole Body Border -->
  <rect x="23" y="14" width="18" height="36" rx="9" fill="none" stroke="url(#barber-gold)" stroke-width="2"/>

  <!-- Barber Pole Bottom Cap -->
  <path d="M18 50h28v2a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2v-2z" fill="url(#barber-gold)"/>
  <circle cx="32" cy="55" r="2.5" fill="url(#barber-gold)"/>

  <!-- Mini Scissors decorative icon on left -->
  <circle cx="12" cy="48" r="3" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M14 46 L21 39" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mini Comb decorative icon on right -->
  <path d="M46 39 L53 46 M48 40 L51 43 M50 42 L53 45" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
</svg>